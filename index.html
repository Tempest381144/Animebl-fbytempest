// --- HELPER FUNCTIONS ---
const createDeck = () => {
  let deck = [];
  let idCounter = 0;
  ALL_CARDS.forEach(char => {
    for (let i = 0; i < char.count; i++) {
      deck.push({ ...char, uniqueId: `card_${idCounter++}` });
    }
  });
  // Shuffle
  for (let i = deck.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [deck[i], deck[j]] = [deck[j], deck[i]];
  }
  return deck;
};

const getRandomCharacter = () => {
  return CHARACTERS[Math.floor(Math.random() * CHARACTERS.length)].id;
};

// Önce LOCAL_IMAGES'taki resmi dener, yoksa/yüklenemezse dahili çizimi gösterir
function CharImage({ id, name, className }) {
  const [failed, setFailed] = useState(false);
  const src = LOCAL_IMAGES[id];
  if (src && !failed) {
    return <img src={src} alt={name} onError={() => setFailed(true)} className={`${className} overflow-hidden`} />;
  }
  return <div className={`${className} overflow-hidden`}><CharArt id={id} /></div>;
}

// --- MAIN COMPONENT ---
function AnimeBlofMobile() {
  // GAME STATES
  const [gameState, setGameState] = useState('START'); // START, PLAYING, ROULETTE, GAMEOVER
  const [players, setPlayers] = useState([]);
  const [turn, setTurn] = useState(0);
  const [tablePile, setTablePile] = useState([]);
  const [targetChar, setTargetChar] = useState(null);
  const [lastPlay, setLastPlay] = useState(null);
  const [logs, setLogs] = useState([]);
  const [winner, setWinner] = useState(null);

  // HUMAN UI STATES
  const [selectedCards, setSelectedCards] = useState([]);

  // ROULETTE STATE (phase: reveal -> spinning -> died/survived)
  const [rouletteState, setRouletteState] = useState(null);

  // AUDIO STATES
  const [isAudioPlaying, setIsAudioPlaying] = useState(false);
  const audioRef = useRef(null);

  // --- AUDIO LOGIC ---
  const toggleAudio = () => {
    if (!audioRef.current) return;
    if (isAudioPlaying) {
      audioRef.current.pause();
      setIsAudioPlaying(false);
    } else {
      audioRef.current.play().then(() => setIsAudioPlaying(true)).catch(console.error);
    }
  };

  const addLog = (msg) => {
    setLogs(prev => [...prev, `[${new Date().toLocaleTimeString('tr-TR', { hour12: false })}] ${msg}`].slice(-8));
  };

  // --- INIT GAME ---
  const initGame = () => {
    if (!audioRef.current) {
      audioRef.current = new Audio(BG_MUSIC_URL);
      audioRef.current.loop = true;
      audioRef.current.volume = 0.3;
    }

    if (!isAudioPlaying) {
      audioRef.current.play().then(() => setIsAudioPlaying(true)).catch(e => console.log("Audio prevented", e));
    }

    const deck = createDeck();
    const newPlayers = [
      { id: 0, name: 'Sen', isBot: false, isAlive: true, hand: [], chambers: 6 },
      { id: 1, name: 'Muhtar', isBot: true, isAlive: true, hand: [], chambers: 6 },
      { id: 2, name: 'Kürek', isBot: true, isAlive: true, hand: [], chambers: 6 },
      { id: 3, name: 'Arap', isBot: true, isAlive: true, hand: [], chambers: 6 },
    ];

    // Initial Deal (26 cards among 4 players)
    deck.forEach((card, idx) => {
       newPlayers[idx % 4].hand.push(card);
    });

    setPlayers(newPlayers);
    setTablePile([]);

    const newTarget = getRandomCharacter();
    setTargetChar(newTarget);

    setLastPlay(null);
    setTurn(0);
    setSelectedCards([]);
    setLogs([]);
    setWinner(null);
    setRouletteState(null);
    setGameState('PLAYING');

    const charName = CHARACTERS.find(c => c.id === newTarget).name;
    addLog(`Oyun başladı! Masa: ${charName}`);
  };

  const getNextAlivePlayer = (currentTurn, currentPlayers) => {
    let next = (currentTurn + 1) % 4;
    let iterations = 0;
    while (!currentPlayers[next].isAlive && iterations < 4) {
      next = (next + 1) % 4;
      iterations++;
    }
    return next;
  };

  const checkWinCondition = (currentPlayers) => {
    const alivePlayers = currentPlayers.filter(p => p.isAlive);
    if (alivePlayers.length === 1) {
      setWinner(alivePlayers[0]);
      setGameState('GAMEOVER');
      return true;
    }

    const emptyHandPlayer = alivePlayers.find(p => p.hand.length === 0);
    if (emptyHandPlayer && lastPlay?.playerId !== emptyHandPlayer.id) {
      setWinner(emptyHandPlayer);
      setGameState('GAMEOVER');
      return true;
    }
    return false;
  };

  // --- ROULETTE & RESHUFFLE LOGIC ---
  // reveal: yalan denildiğinde açılan kartların bilgisi (null olabilir)
  const triggerRoulette = (playerId, currentPlayersState, reveal = null) => {
    setGameState('ROULETTE');
    const player = currentPlayersState[playerId];
    const riskChances = player.chambers;

    const startSpin = () => {
      setRouletteState({
        targetId: playerId,
        phase: 'spinning',
        reveal,
        message: `${player.name} Rus Ruleti'ne giriyor... (1/${riskChances})`
      });

      setTimeout(() => {
        const isDead = Math.floor(Math.random() * player.chambers) === 0;
        let newPlayers = [...currentPlayersState];

        if (isDead) {
          setRouletteState({ targetId: playerId, phase: 'died', reveal, message: `BAM! ${player.name} elendi!` });
          addLog(`BAM! ${player.name} Rus Ruleti'ni kaybetti ve öldü!`);
          newPlayers[playerId].isAlive = false;
          newPlayers[playerId].hand = [];
        } else {
          setRouletteState({ targetId: playerId, phase: 'survived', reveal, message: `KLİK! ${player.name} hayatta!` });
          newPlayers[playerId].chambers = Math.max(1, newPlayers[playerId].chambers - 1);
          addLog(`Klik! ${player.name} hayatta kaldı. Yeni şansı: 1/${newPlayers[playerId].chambers}.`);
        }

        setTimeout(() => {
          setTablePile([]);
          setLastPlay(null);
          setRouletteState(null);

          // RESHUFFLE EVERYTHING AMONG SURVIVORS
          const aliveIds = newPlayers.filter(p => p.isAlive).map(p => p.id);

          if (aliveIds.length > 0) {
             newPlayers.forEach(p => p.hand = []);
             const freshDeck = createDeck();
             freshDeck.forEach((card, idx) => {
                 const targetId = aliveIds[idx % aliveIds.length];
                 newPlayers[targetId].hand.push(card);
             });
          }

          const newTarget = getRandomCharacter();
          setTargetChar(newTarget);
          const newTargetName = CHARACTERS.find(c => c.id === newTarget).name;

          addLog(`Kartlar sıfırlanıp yeniden dağıtıldı! Yeni Masa: ${newTargetName}`);

          setPlayers(newPlayers);

          if (!checkWinCondition(newPlayers)) {
            setTurn(isDead ? getNextAlivePlayer(playerId, newPlayers) : playerId);
            setGameState('PLAYING');
          }
        }, 3500);
      }, 2000);
    };

    if (reveal) {
      // Önce kartları göster, sonra ruleti başlat
      setRouletteState({ targetId: playerId, phase: 'reveal', reveal, message: '' });
      setTimeout(startSpin, 3200);
    } else {
      startSpin();
    }
  };

  // --- PLAY CARDS LOGIC ---
  const handlePlayCards = (playerId, cardIndices) => {
    const player = players[playerId];
    if (cardIndices.length === 0 || cardIndices.length > 3) return;
    if (!targetChar) return;

    const playedCards = cardIndices.map(idx => player.hand[idx]);
    const newHand = player.hand.filter((_, idx) => !cardIndices.includes(idx));

    const newPlayers = [...players];
    newPlayers[playerId].hand = newHand;

    setTablePile(prev => [...prev, ...playedCards]);
    setLastPlay({
      playerId,
      cards: playedCards,
      claimCount: playedCards.length
    });

    addLog(`${player.name}, masaya ${playedCards.length} kart sürdü.`);

    setPlayers(newPlayers);
    setSelectedCards([]);

    if (!checkWinCondition(newPlayers)) {
      setTurn(getNextAlivePlayer(playerId, newPlayers));
    }
  };

  // --- BLUFF (YALAN) LOGIC ---
  const handleCallBluff = (callerId) => {
    if (!lastPlay) return;
    const caller = players[callerId];
    const targetPlayerId = lastPlay.playerId;
    const targetPlayer = players[targetPlayerId];

    addLog(`${caller.name}, ${targetPlayer.name}'e "YALAN!" dedi.`);

    const isLying = lastPlay.cards.some(card => card.id !== targetChar && !card.isJoker);
    const claimedName = CHARACTERS.find(c => c.id === targetChar).name;

    let loserId;
    if (isLying) {
      addLog(`YAKALANDI! ${targetPlayer.name} yalan söylüyordu.`);
      loserId = targetPlayerId;
    } else {
      addLog(`YANLIŞ TAHMİN! ${targetPlayer.name} doğru söylüyordu.`);
      loserId = callerId;
    }

    addLog(`Açılan kartlar: ${lastPlay.cards.map(c => c.name).join(', ')}`);

    // Bir önceki oyuncunun attığı kartlar herkese gösterilir
    const reveal = {
      cards: lastPlay.cards,
      targetId: targetChar,
      isLying,
      title: `${targetPlayer.name}: "${lastPlay.claimCount} adet ${claimedName}" demişti`,
      verdict: isLying
        ? `YALAN! ${targetPlayer.name} blöf yapıyordu`
        : `DOĞRU! ${targetPlayer.name} doğru söylüyordu`,
    };

    triggerRoulette(loserId, players, reveal);
  };

  // --- BOT AI ---
  useEffect(() => {
    if (gameState !== 'PLAYING') return;
    const currentPlayer = players[turn];
    if (!currentPlayer || !currentPlayer.isBot || !currentPlayer.isAlive) return;

    const botTimer = setTimeout(() => {
      // 1. Call Bluff Decision
      if (lastPlay) {
        const botHandCountOfTarget = currentPlayer.hand.filter(c => c.id === targetChar || c.isJoker).length;
        const totalClaimed = lastPlay.claimCount;

        let callChance = 0.08;
        if (botHandCountOfTarget + totalClaimed > 6) {
          callChance = 1.0;
        } else if (botHandCountOfTarget >= 3) {
          callChance = 0.45;
        }

        if (Math.random() < callChance) {
          handleCallBluff(currentPlayer.id);
          return;
        }
      }

      // 2. Play Cards Decision
      let cardsToPlayIndices = [];

      currentPlayer.hand.forEach((c, idx) => {
          if (cardsToPlayIndices.length < 3 && (c.id === targetChar || c.isJoker)) {
              cardsToPlayIndices.push(idx);
          }
      });

      if (cardsToPlayIndices.length === 0) {
          const bluffCount = Math.floor(Math.random() * 2) + 1;
          const availableIndices = currentPlayer.hand.map((_, i) => i);

          for (let i = availableIndices.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [availableIndices[i], availableIndices[j]] = [availableIndices[j], availableIndices[i]];
          }

          for(let i = 0; i < Math.min(bluffCount, availableIndices.length); i++){
               cardsToPlayIndices.push(availableIndices[i]);
          }
      }

      handlePlayCards(currentPlayer.id, cardsToPlayIndices);

    }, 1800);

    return () => clearTimeout(botTimer);
  }, [turn, gameState, players, lastPlay, targetChar]);

  // --- UI RENDERERS ---
  const renderCard = (card, index, isHidden = false, selectable = false, selected = false) => {
    return (
      <div
        key={card?.uniqueId || index}
        onClick={() => selectable && handleCardClick(index)}
        className={`relative w-14 h-20 sm:w-20 sm:h-28 rounded-lg shadow-lg overflow-hidden cursor-pointer transition-transform duration-200 border shrink-0
          ${isHidden ? 'bg-gray-800 border-gray-600' : `bg-gradient-to-br ${card.color} border-gray-500`}
          ${selected ? 'transform -translate-y-3 border-yellow-400 shadow-[0_0_15px_rgba(250,204,21,0.6)]' : 'hover:-translate-y-1'}
        `}
      >
        {isHidden ? (
           <div className="w-full h-full flex items-center justify-center bg-gray-900">
             <span className="text-gray-500 text-sm font-black">?</span>
           </div>
        ) : (
          <>
            <CharImage
              id={card.id}
              name={card.name}
              className="absolute inset-0 w-full h-full object-cover z-10"
            />

            <div className="absolute bottom-0 w-full p-1 text-center text-[9px] sm:text-[10px] font-black text-white bg-black/80 z-20 uppercase tracking-widest truncate">
              {card.name}
            </div>
            {card.isJoker && (
                <div className="absolute top-1 left-1 text-yellow-400 text-[8px] font-black bg-black/90 px-1 rounded z-20">JOKER</div>
            )}
          </>
        )}
      </div>
    );
  };

  // Yalan denince açılan kart: masadaki karaktere uyuyorsa yeşil, uymuyorsa kırmızı
  const renderRevealedCard = (card, i, targetId) => {
    const ok = card.id === targetId || card.isJoker;
    return (
      <div
        key={card.uniqueId || i}
        className={`relative rounded-lg ring-2 transform scale-125 mx-2 ${ok ? 'ring-green-500' : 'ring-red-600'}`}
      >
        {renderCard(card, i)}
        <div className={`absolute -top-2 -right-2 z-30 w-5 h-5 rounded-full flex items-center justify-center text-[11px] font-black ${ok ? 'bg-green-500 text-black' : 'bg-red-600 text-white'}`}>
          {ok ? '✓' : '✕'}
        </div>
      </div>
    );
  };

  const handleCardClick = (index) => {
    if (turn !== 0 || gameState !== 'PLAYING') return;
    if (selectedCards.includes(index)) {
      setSelectedCards(prev => prev.filter(i => i !== index));
    } else {
      if (selectedCards.length < 3) {
        setSelectedCards(prev => [...prev, index]);
      }
    }
  };

  const humanPlay = () => {
    if (selectedCards.length === 0 || selectedCards.length > 3) return;
    handlePlayCards(0, selectedCards);
  };

  const targetCharObj = targetChar ? CHARACTERS.find(c => c.id === targetChar) : null;

  return (
    <div className="min-h-screen bg-gray-950 text-white font-sans relative overflow-hidden flex flex-col select-none max-w-md mx-auto sm:max-w-none shadow-2xl">

      {/* Background Image Overlay */}
      <div
        className="absolute inset-0 z-0 opacity-15 pointer-events-none"
        style={{ backgroundImage: 'radial-gradient(circle at 20% 15%, #7c3aed 0, transparent 45%), radial-gradient(circle at 80% 75%, #dc2626 0, transparent 45%)' }}
      />
      <div className="absolute inset-0 z-0 bg-gradient-to-b from-transparent via-black/70 to-black pointer-events-none"></div>

      {/* Top Header */}
      <header className="relative z-10 px-3 py-2 flex justify-between items-center bg-black/60 backdrop-blur-md border-b border-gray-800">
        <h1 className="text-base sm:text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-red-500 via-purple-500 to-red-500 tracking-wider">
          ANIME BLÖF
        </h1>
        <button onClick={toggleAudio} className="p-2 bg-gray-900 rounded-full hover:bg-gray-800 transition border border-gray-700">
          {isAudioPlaying ? <Volume2 size={16} className="text-green-400" /> : <VolumeX size={16} className="text-red-500" />}
        </button>
      </header>

      {/* Main Game Area */}
      {gameState !== 'START' && (
        <main className="flex-1 relative z-10 flex flex-col justify-between p-2 sm:p-4">

          {/* Bots Area (Mobile Optimized Grid) */}
          <div className="grid grid-cols-3 gap-2 mb-2">
            {[1, 2, 3].map(botIdx => {
                const bot = players[botIdx];
                if (!bot) return null;
                return (
                    <div key={bot.id} className={`flex flex-col items-center p-2 rounded-lg bg-gray-900/90 border ${turn === bot.id ? 'border-yellow-400 shadow-[0_0_15px_rgba(250,204,21,0.4)] scale-105' : 'border-gray-800'} transition-all duration-300 relative`}>
                      <div className="relative mb-1">
                        <BotAvatar name={bot.name} alive={bot.isAlive} />
                        {!bot.isAlive && <Skull className="absolute -top-2 -right-2 text-red-600 bg-black rounded-full p-0.5" size={20} />}
                      </div>
                      <span className="font-black text-[11px] sm:text-xs text-gray-200 uppercase truncate w-full text-center">{bot.name}</span>
                      <span className="text-[9px] text-gray-400">{bot.isAlive ? `${bot.hand.length} Kart` : 'Öldü'}</span>
                      {bot.isAlive && (
                         <span className="text-[8px] text-red-400 font-bold bg-red-950/80 px-1.5 py-0.5 rounded mt-0.5 border border-red-900">
                           1/{bot.chambers}
                         </span>
                      )}
                    </div>
                )
            })}
          </div>

          {/* Table Center */}
          <div className="flex-1 flex flex-col items-center justify-center my-1">

            {/* System Target Banner */}
            {targetCharObj && (
              <div className="mb-3 flex flex-col items-center">
                <div className="bg-red-600 text-white text-[9px] font-black tracking-widest px-4 py-0.5 rounded-t-md shadow">
                  İSTENEN MASA
                </div>
                <div className="flex items-center gap-2 bg-gray-900/90 px-4 py-2 rounded-lg rounded-t-none border border-red-900/60 shadow-lg backdrop-blur-sm">
                  <Target size={18} className="text-red-500 animate-pulse" />
                  <CharImage
                    id={targetCharObj.id}
                    name={targetCharObj.name}
                    className="w-8 h-8 rounded-full border border-red-500 object-cover"
                  />
                  <span className="text-sm sm:text-xl font-black uppercase text-white tracking-wider">{targetCharObj.name}</span>
                </div>
              </div>
            )}

            {/* Play Pile Circle */}
            <div className="relative w-32 h-32 sm:w-48 sm:h-48 rounded-full border border-gray-700 bg-gray-900/50 flex flex-col items-center justify-center shadow-inner backdrop-blur-sm">
              {tablePile.length > 0 ? (
                <>
                  <div className="relative w-14 h-20 sm:w-20 sm:h-28">
                    {[...Array(Math.min(tablePile.length, 5))].map((_, i) => (
                       <div key={i} className="absolute inset-0" style={{ transform: `rotate(${i * 6}deg) translate(${i * 2}px, ${i * 2}px)` }}>
                         {renderCard(null, i, true)}
                       </div>
                    ))}
                  </div>
                  <div className="absolute -bottom-3 bg-black/90 px-3 py-0.5 rounded-full border border-gray-600 text-[10px] font-black text-yellow-400 shadow">
                     {tablePile.length} KART
                  </div>
                </>
              ) : (
                <span className="text-gray-500 text-[10px] sm:text-xs font-bold uppercase tracking-widest">Masa Boş</span>
              )}
            </div>

          </div>

          {/* Human Hand & Controls */}
          <div className="w-full flex flex-col items-center mt-auto">

            {/* Status & Action Buttons */}
            <div className="w-full flex justify-between items-center bg-gray-900/90 p-2.5 rounded-t-xl border-t border-x border-gray-800 gap-2 backdrop-blur-md">
              <div className="flex flex-col">
                {turn === 0 ? (
                  <span className="text-green-400 font-black text-xs sm:text-sm uppercase tracking-wider animate-pulse">Sıra Sende!</span>
                ) : (
                  <span className="text-gray-400 text-xs uppercase">Sıra: <span className="text-white font-bold">{players[turn]?.name}</span></span>
                )}
                {players[0] && players[0].isAlive && (
                  <span className="text-[10px] text-red-400 font-bold flex items-center gap-1 mt-0.5">
                    <Skull size={12} /> Ölüm Riski: 1/{players[0].chambers}
                  </span>
                )}
              </div>

              <div className="flex gap-2">
                {turn === 0 && tablePile.length > 0 && lastPlay && lastPlay.playerId !== 0 && (
                   <button
                     onClick={() => handleCallBluff(0)}
                     className="px-3 py-2 bg-red-600 hover:bg-red-700 text-white font-black rounded-lg shadow text-xs uppercase flex items-center gap-1"
                   >
                     <AlertTriangle size={14} /> YALAN!
                   </button>
                )}

                {turn === 0 && (
                   <button
                     onClick={humanPlay}
                     disabled={selectedCards.length === 0}
                     className="px-4 py-2 bg-blue-600 hover:bg-blue-700 disabled:bg-gray-800 disabled:text-gray-500 text-white font-black rounded-lg shadow text-xs uppercase"
                   >
                     AT {selectedCards.length > 0 && `(${selectedCards.length})`}
                   </button>
                )}
              </div>
            </div>

            {/* Human Hand Cards */}
            <div className={`w-full bg-black/95 p-3 flex justify-center gap-1.5 overflow-x-auto min-h-[110px] sm:min-h-[150px] border-t border-gray-800 ${players[0] && !players[0].isAlive ? 'opacity-30 pointer-events-none' : ''}`}>
              {players[0]?.hand.map((card, idx) =>
                 renderCard(card, idx, false, turn === 0, selectedCards.includes(idx))
              )}
            </div>
          </div>

          {/* Mini Logs Box */}
          <div className="absolute top-12 left-2 right-2 max-h-20 overflow-y-auto bg-black/80 p-2 rounded text-[9px] text-gray-300 font-mono border border-gray-800 pointer-events-none z-30 hidden sm:block">
            {logs.map((l, i) => <div key={i}>{l}</div>)}
          </div>

        </main>
      )}

      {/* START MODAL */}
      {gameState === 'START' && (
        <div className="absolute inset-0 z-50 flex items-center justify-center bg-black/95 backdrop-blur-xl p-4">
          <div className="bg-gray-900 border border-gray-700 p-6 rounded-2xl max-w-sm w-full text-center shadow-2xl relative">
            <h2 className="text-2xl font-black text-transparent bg-clip-text bg-gradient-to-br from-red-500 via-purple-500 to-pink-500 mb-3 uppercase tracking-wider">
              Anime Blöf
            </h2>

            <div className="text-gray-300 mb-6 text-xs space-y-2 text-left bg-black/60 p-3 rounded-lg border border-gray-800">
              <p>• Masa hangi karakteri derse o atılır.</p>
              <p>• Elinde yoksa blöf yapmak zorundasın.</p>
              <p>• "Yalan" denince atılan kartlar açılır.</p>
              <p>• Yalan yakalanırsa <strong>Rus Ruleti</strong> (1/6) başlar.</p>
              <p>• Hayatta kalırsan risk daralır (1/5) ve kartlar tamamen yeniden dağıtılır.</p>
              <p>• <strong>Hisoka</strong> Joker'dir.</p>
            </div>

            <button
              onClick={initGame}
              className="w-full py-3 rounded-xl bg-gradient-to-r from-red-600 to-purple-700 hover:from-red-500 hover:to-purple-600 disabled:bg-gray-800 disabled:text-gray-500 text-white font-black text-sm shadow flex items-center justify-center gap-2 uppercase tracking-widest"
            >
              <><Play size={18} fill="currentColor" /> OYUNA BAŞLA</>
            </button>
          </div>
        </div>
      )}

      {/* REVEAL + ROULETTE MODAL */}
      {gameState === 'ROULETTE' && rouletteState && (
        <div className="absolute inset-0 z-50 flex items-center justify-center bg-black/95 backdrop-blur-xl p-4">
          <div className="text-center w-full flex flex-col items-center gap-6">

            {/* Açılan kartlar (yalan denildiyse) */}
            {rouletteState.reveal && (
              <div className="flex flex-col items-center gap-3">
                <p className="text-[11px] text-gray-300 font-bold">{rouletteState.reveal.title}</p>
                <div className="flex justify-center py-3">
                  {rouletteState.reveal.cards.map((card, i) =>
                    renderRevealedCard(card, i, rouletteState.reveal.targetId)
                  )}
                </div>
                {rouletteState.phase === 'reveal' && (
                  <h2 className={`text-base font-black uppercase tracking-wider animate-pulse ${rouletteState.reveal.isLying ? 'text-red-500' : 'text-green-400'}`}>
                    {rouletteState.reveal.verdict}
                  </h2>
                )}
              </div>
            )}

            {rouletteState.phase === 'spinning' && (
                <div className="flex flex-col items-center animate-pulse">
                   <Skull size={70} className="text-red-600 mb-4 animate-spin" />
                   <h2 className="text-lg font-black text-red-500 uppercase tracking-wider">{rouletteState.message}</h2>
                </div>
            )}
            {rouletteState.phase === 'died' && (
                <div className="flex flex-col items-center animate-bounce">
                   <Skull size={90} className="text-red-700 mb-4" />
                   <h2 className="text-xl font-black text-red-600 uppercase tracking-wider bg-black p-4 rounded-xl border border-red-700">{rouletteState.message}</h2>
                </div>
            )}
            {rouletteState.phase === 'survived' && (
                <div className="flex flex-col items-center">
                   <div className="w-16 h-16 rounded-full border-2 border-green-500 flex items-center justify-center mb-4 bg-green-900/30">
                      <span className="text-green-500 text-3xl font-bold">✓</span>
                   </div>
                   <h2 className="text-lg font-black text-green-400 uppercase tracking-wider">{rouletteState.message}</h2>
                </div>
            )}
          </div>
        </div>
      )}

      {/* GAME OVER MODAL */}
      {gameState === 'GAMEOVER' && winner && (
        <div className="absolute inset-0 z-50 flex items-center justify-center bg-black/95 backdrop-blur-xl p-4">
          <div className="bg-gray-900 border border-yellow-500 p-6 rounded-2xl max-w-sm w-full text-center shadow-2xl">
            <h2 className="text-3xl font-black text-yellow-400 mb-4 uppercase tracking-widest">Oyun Bitti!</h2>
            <div className="text-base text-white mb-6 bg-black p-4 rounded-xl border border-gray-700">
              <span className="text-gray-400 text-xs font-bold block mb-1">KAZANAN</span>
              <span className="font-black text-yellow-300 text-2xl uppercase">{winner.name}</span>
            </div>
            <button
              onClick={initGame}
              className="w-full py-3 rounded-xl bg-white text-black hover:bg-gray-200 font-black text-sm uppercase tracking-widest shadow"
            >
              YENİDEN OYNA
            </button>
          </div>
        </div>
      )}

    </div>
  );
}

    ReactDOM.createRoot(document.getElementById('root')).render(<AnimeBlofMobile />);
  </script>
</body>
</html>
